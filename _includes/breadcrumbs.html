<nav class="breadcrumbs" aria-label="Breadcrumb">
  <ol>
    {% if page.url != '/' %}
    <li><a href="{{ '/' | relative_url }}">Learn</a></li>
    {% endif %}
    {% for crumb in page.catalog_breadcrumbs %}
    <li><a href="{{ crumb.url | relative_url | uri_escape }}">{{ crumb.title | escape }}</a></li>
    {% endfor %}
    <li aria-current="page">{{ page.title | escape }}</li>
  </ol>
</nav>
