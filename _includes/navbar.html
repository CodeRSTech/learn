<nav class="site-nav" aria-label="Main navigation">
  <div class="nav-inner">
    <a class="site-brand" href="{{ '/' | relative_url }}">{{ site.data.navigation.brand | escape }}<span class="brand-dot">.</span></a>
    <ul class="site-nav-links">
      {% for link in site.data.navigation.links %}
      <li><a href="{% if link.url == '/' %}{{ '/' | relative_url }}{% else %}{{ link.url }}{% endif %}">{{ link.title | escape }}</a></li>
      {% endfor %}
    </ul>
  </div>
</nav>
