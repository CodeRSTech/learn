<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Fira Code font -->
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/terminal.css">
  <link rel="stylesheet" href="/assets/css/jeckyll_tabs.css">
  <link rel="stylesheet" href="/assets/css/profiles.css">
  <link rel="stylesheet" href="/assets/css/top_navbar.css">
  <link rel="stylesheet" href="/assets/css/images.css">
  {% if page.stylesheet %}
  <link rel="stylesheet" href="{{ page.stylesheet | relative_url }}">
  {% endif %}
  <!--link rel="stylesheet" href="/assets/css/"-->
</head>
<!-- Native Scrollspy applied directly to the body -->
<body class="bg-dark text-light" data-bs-spy="scroll" data-bs-target="#toc-nav">
  {% include navbar.html %}
  <!-- Reduced from px-3 (1rem) to px-1 (0.25rem) or px-2 (0.5rem) on mobile -->
  <!-- Reduced from px-md-5 (3rem) to px-md-4 (1.5rem) on desktop -->
  <div class="container-fluid px-1 px-md-3">
    {{ content }}
  </div>
  <!-- Essential Bootstrap Bundle for Mobile Toggler and Native Scrollspy -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
