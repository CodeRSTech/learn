<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} | {{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/learn.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/topics-index.css' | relative_url }}">
  {% if page.stylesheet %}
  <link rel="stylesheet" href="{{ page.stylesheet | relative_url }}">
  {% endif %}
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  {% include navbar.html %}
  <div id="main-content" class="site-content" tabindex="-1">
    {{ content }}
  </div>
{% include footer.html %}
</body>
</html>
