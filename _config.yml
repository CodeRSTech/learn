title: Learn
description: A multi-disciplinary learning reference guide.
theme: jekyll-theme-minimal
baseurl: "/learn"
plugins:
  - jekyll-relative-links
  - jekyll-tabs
exclude:
  - node_modules
  - tests
  - README.md
  - ROADMAP.md
  - Gemfile
  - Gemfile.lock
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: true